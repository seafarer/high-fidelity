<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      /* Square app icon: the header's HF block, flattened (no tilt) so it stays crisp at 32px. */
      html, body { width: 512px; height: 512px; overflow: hidden; background: #16131d; }
      body { display: grid; place-items: center; }
      .mark {
        width: 400px; height: 400px; display: grid; place-items: center;
        background: #ff3b8d; color: #16131d; border: 28px solid #f3eee3;
        box-shadow: 24px 24px 0 #5a3ff0; translate: -12px -12px;
        font-family: "Anton", sans-serif; font-size: 210px; line-height: 1; letter-spacing: -.01em;
      }
    </style>
  </head>
  <body><span class="mark">HF</span></body>
</html>
